<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Genji Skill Leaderboard — spike 003</title>
<style>
  :root {
    --bg:#0c0f13; --panel:#141a21; --panel2:#1b232c; --line:#26313c;
    --txt:#e6edf3; --dim:#8b9aa9; --accent:#3fb950; --accent2:#58a6ff;
    --gold:#e3b341; --silver:#b9c2cb; --bronze:#cd7f47; --bad:#f85149;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; letter-spacing:.3px; }
  header h1 b { color:var(--accent); }
  header .stats { color:var(--dim); font-size:12px; }
  .wrap { display:grid; grid-template-columns:300px 1fr; gap:0; height:calc(100vh - 59px); }
  aside { background:var(--panel); border-right:1px solid var(--line); padding:18px;
    overflow-y:auto; }
  aside h2 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim);
    margin:0 0 14px; }
  .knob { margin-bottom:16px; }
  .knob label { display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px; }
  .knob label .v { color:var(--accent); font-variant-numeric:tabular-nums; font-weight:600; }
  .knob input[type=range] { width:100%; accent-color:var(--accent); }
  .knob small { color:var(--dim); font-size:10.5px; display:block; margin-top:2px; }
  .toggle { display:flex; align-items:center; gap:8px; margin:14px 0; font-size:12px; }
  .row-btns { display:flex; gap:8px; margin-top:8px; }
  button { background:var(--panel2); color:var(--txt); border:1px solid var(--line);
    padding:7px 12px; border-radius:7px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--accent); }
  main { overflow-y:auto; padding:0; }
  table { width:100%; border-collapse:collapse; }
  th { position:sticky; top:0; background:var(--bg); text-align:left; padding:10px 14px;
    font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim);
    border-bottom:1px solid var(--line); z-index:2; }
  td { padding:9px 14px; border-bottom:1px solid #1a2129; font-variant-numeric:tabular-nums; }
  tr.player { cursor:pointer; }
  tr.player:hover td { background:#11171e; }
  tr.synthetic td { background:rgba(227,179,65,.06); }
  tr.synthetic .name { color:var(--gold); }
  .pos { color:var(--dim); width:38px; }
  .name { font-weight:500; }
  .bar { height:7px; background:var(--accent); border-radius:4px; min-width:2px;
    box-shadow:0 0 8px rgba(63,185,80,.4); }
  .barcell { width:30%; }
  .num { text-align:right; color:var(--dim); }
  .skill { color:var(--accent); font-weight:700; text-align:right; }
  .pill { font-size:10px; padding:1px 6px; border-radius:10px; border:1px solid var(--line);
    color:var(--dim); }
  .vid { color:var(--accent2); }
  .detail td { background:#0a0d11; padding:0; }
  .detail-inner { padding:12px 18px 16px 56px; }
  .detail-inner h3 { margin:4px 0 10px; font-size:12px; color:var(--dim); font-weight:600; }
  .mapline { display:grid; grid-template-columns:26px 1fr 90px 70px 70px; gap:10px;
    align-items:center; padding:3px 0; font-size:12px; border-bottom:1px solid #141a21; }
  .mapline .mrank { color:var(--dim); }
  .mapline .mdiff { color:var(--dim); font-size:11px; }
  .mapline .mc { text-align:right; color:var(--accent); font-variant-numeric:tabular-nums; }
  .badge { font-size:10px; padding:0 5px; border-radius:8px; }
  .b-gold{background:rgba(227,179,65,.18);color:var(--gold);}
  .b-silver{background:rgba(185,194,203,.15);color:var(--silver);}
  .b-bronze{background:rgba(205,127,71,.18);color:var(--bronze);}
  .b-wr{background:rgba(88,166,255,.18);color:var(--accent2);}
  .b-floor{color:#5b6b7a;}
  .b-video{color:var(--accent);}
  .loading { color:var(--dim); padding:24px; }
</style>
</head>
<body>
<header>
  <h1>Genji <b>Skill</b> Leaderboard <span style="color:var(--dim);font-weight:400">— spike 003</span></h1>
  <span class="stats" id="stats">loading…</span>
</header>
<div class="wrap">
  <aside>
    <h2>Scoring Weights</h2>
    <div id="knobs"></div>
    <div class="toggle">
      <input type="checkbox" id="synthetic" />
      <label for="synthetic">inject ★ farm / elite profiles</label>
    </div>
    <small style="color:var(--dim)">Watch <b style="color:var(--accent)">easy-grinder-200</b> sink as you raise <b>gamma</b>. At gamma 0 it climbs — that's the farmable regime.</small>
    <div class="row-btns">
      <button id="reset">Reset defaults</button>
      <button id="farmable" title="gamma=0">Make farmable</button>
    </div>
  </aside>
  <main>
    <table>
      <thead><tr>
        <th class="pos">#</th><th>Player</th><th class="barcell">Skill</th>
        <th class="num">Score</th><th class="num">Maps</th><th class="num">Video</th><th class="num">Hardest</th>
      </tr></thead>
      <tbody id="board"><tr><td colspan="7" class="loading">computing…</td></tr></tbody>
    </table>
  </main>
</div>
<script>
const KNOBS = [
  ["diff_base",1.41,1.1,2.0,0.01,"Difficulty curve base. diff_weight = base^(raw−1.5). Higher → hard maps worth dramatically more."],
  ["gamma",0.5,0.0,1.2,0.05,"Diminishing returns across maps. The anti-farm dial. 0 = pure sum (farmable). 1 = peak-only."],
  ["time_bonus",1.0,0.0,3.0,0.1,"Max bonus for a field-topping time (video runs only)."],
  ["wr_bonus",0.5,0.0,3.0,0.1,"Extra multiplier for a world record (video_rank 1)."],
  ["partial_factor",1.0,0.0,1.0,0.05,"Credit for partial (no-video) clears. Lower → demote screenshot-only volume below video-proven players."],
  ["shrink_k",4.0,0.0,20.0,0.5,"Field-size shrinkage so small fields don't mint fake time-wins."],
  ["medal_gold",1.5,1.0,3.0,0.05,"Gold medal multiplier (video runs)."],
];
const state = {}; KNOBS.forEach(([k,d])=>state[k]=d);
state.medal_silver=1.3; state.medal_bronze=1.15; state.include_synthetic=false;
let MAX=1;

const knobsEl = document.getElementById('knobs');
KNOBS.forEach(([k,def,min,max,step,desc])=>{
  const d=document.createElement('div'); d.className='knob';
  d.innerHTML=`<label>${k} <span class="v" id="v_${k}">${def}</span></label>
    <input type="range" id="r_${k}" min="${min}" max="${max}" step="${step}" value="${def}">
    <small>${desc}</small>`;
  knobsEl.appendChild(d);
  d.querySelector('input').addEventListener('input',e=>{
    state[k]=parseFloat(e.target.value);
    document.getElementById('v_'+k).textContent=(+state[k]).toFixed(2);
    schedule();
  });
});
document.getElementById('synthetic').addEventListener('change',e=>{state.include_synthetic=e.target.checked;schedule();});
document.getElementById('reset').addEventListener('click',()=>setAll(Object.fromEntries(KNOBS.map(([k,d])=>[k,d]))));
document.getElementById('farmable').addEventListener('click',()=>setAll({gamma:0}));
function setAll(vals){ for(const k in vals){ state[k]=vals[k]; const r=document.getElementById('r_'+k); if(r){r.value=vals[k]; document.getElementById('v_'+k).textContent=(+vals[k]).toFixed(2);} } schedule(); }

let timer=null, openUid=null;
function schedule(){ clearTimeout(timer); timer=setTimeout(refresh,90); }

async function refresh(){
  const res=await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});
  const data=await res.json();
  MAX=data.leaderboard.length? data.leaderboard[0].skill : 1;
  render(data.leaderboard.slice(0,80));
  document.getElementById('stats').textContent=`${data.total} players ranked · live-tuned over real verified completions`;
}

function render(list){
  const b=document.getElementById('board'); b.innerHTML='';
  for(const r of list){
    const tr=document.createElement('tr'); tr.className='player'+(r.synthetic?' synthetic':'');
    const w=Math.max(2,Math.round(100*r.skill/MAX));
    tr.innerHTML=`<td class="pos">${r.pos}</td>
      <td class="name">${escapeHtml(r.name)}</td>
      <td class="barcell"><div class="bar" style="width:${w}%"></div></td>
      <td class="skill">${r.skill.toFixed(1)}</td>
      <td class="num">${r.maps}</td>
      <td class="num ${r.video_maps?'vid':''}">${r.video_maps||'·'}</td>
      <td class="num">${(+r.hardest).toFixed(2)}</td>`;
    if(!r.synthetic) tr.addEventListener('click',()=>toggle(r.user_id,tr));
    b.appendChild(tr);
  }
}

async function toggle(uid,tr){
  if(openUid===uid){ document.getElementById('detail_'+uid)?.remove(); openUid=null; return; }
  document.querySelectorAll('.detail').forEach(e=>e.remove());
  const res=await fetch('/api/player',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...state,uid})});
  const d=await res.json();
  const det=document.createElement('tr'); det.className='detail'; det.id='detail_'+uid;
  det.innerHTML=`<td colspan="7"><div class="detail-inner">
    <h3>${escapeHtml(d.name)} — per-map contribution (after gamma decay)</h3>
    ${d.breakdown.map(m=>`<div class="mapline">
      <span class="mrank">${m.rank}</span>
      <span>${escapeHtml(m.map_name)} <span class="mdiff">${m.difficulty||('raw '+m.raw.toFixed(1))}</span></span>
      <span>${m.fully_verified?'<span class="badge b-video">video</span>':'<span class="badge b-floor">floor</span>'}
        ${m.medal?`<span class="badge b-${m.medal.toLowerCase()}">${m.medal}</span>`:''}${m.wr?'<span class="badge b-wr">WR</span>':''}</span>
      <span class="num" style="font-size:11px">${m.raw_score.toFixed(2)}</span>
      <span class="mc">+${m.contribution.toFixed(2)}</span>
    </div>`).join('')}
  </div></td>`;
  tr.after(det); openUid=uid;
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
refresh();
</script>
</body>
</html>
