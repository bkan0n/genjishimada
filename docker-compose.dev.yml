services:
  genjishimada-api-dev:
    build:
      context: .
      dockerfile: Dockerfile.api
    stop_grace_period: 45s
    container_name: genjishimada-api-dev
    environment:
      SENTRY_RELEASE: ${SENTRY_RELEASE}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      QUEUE_OPERATOR_IDS: ${QUEUE_OPERATOR_IDS:-141372217677053952}
      SENTRY_DSN: ${SENTRY_DSN}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      PYTHONUNBUFFERED: 1
      PYTHONOPTIMIZE: TRUE
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: noreply@notifications.genji.pk
    restart: unless-stopped
    depends_on:
      genjishimada-db-dev:
        condition: service_healthy
        restart: true
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/healthcheck" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - genji-network

  genjishimada-bot-dev:
    build:
      context: .
      dockerfile: Dockerfile.bot
    stop_grace_period: 45s
    container_name: genjishimada-bot-dev
    environment:
      SENTRY_RELEASE: ${SENTRY_RELEASE}
      SENTRY_DSN: ${SENTRY_DSN}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      QUEUE_OPERATOR_IDS: ${QUEUE_OPERATOR_IDS:-141372217677053952}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
      SENTRY_FEEDBACK_URL: ${SENTRY_FEEDBACK_URL}
      API_KEY: ${API_KEY}
      QUEUE_DATABASE_URL: ${QUEUE_DATABASE_URL:?Set the queue-only PostgreSQL worker URL}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
    depends_on:
      genjishimada-api-dev:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    networks:
      - genji-network

  genjishimada-db-dev:
    container_name: genjishimada-db-dev
    build:
      context: ./infra/postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - genjishimada_db_dev_data:/var/lib/postgresql/data
      - /var/backups/genji/postgres:/backups
    ports:
      - "127.0.0.1:65432:5432"
    networks:
      - genji-network

volumes:
  genjishimada_db_dev_data:
networks:
  genji-network:
    external: true
