name: Lint

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to lint (defaults to triggering SHA)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      # Run ruff through uv so CI uses the version locked in uv.lock — the same
      # one `just lint-api` / `lint-bot` / `lint-sdk` use locally. astral-sh/ruff-action@v1
      # resolved ruff at runtime (`pipx run ruff`, no version pin), so a ruff release
      # could break main with no code change, and its `src` input defaults to `.`,
      # which appended the repo root to the explicit package paths and pulled
      # unrelated files (docs/**/*.md) into the check.
      # RUFF_OUTPUT_FORMAT is set on `check` only (inline PR annotations); the
      # formatter rejects it as an unstable preview flag.
      - name: Ruff format (check)
        id: ruff-format
        continue-on-error: true
        run: uv run ruff format --check apps/api apps/bot libs/sdk

      - name: Ruff check
        id: ruff-check
        continue-on-error: true
        env:
          RUFF_OUTPUT_FORMAT: github
        run: uv run ruff check apps/api apps/bot libs/sdk

      - name: Basedpyright API
        id: pyright-api
        continue-on-error: true
        working-directory: apps/api
        run: uv run basedpyright .

      - name: Basedpyright Bot
        id: pyright-bot
        continue-on-error: true
        run: uv run basedpyright apps/bot

      - name: Basedpyright SDK
        id: pyright-sdk
        continue-on-error: true
        run: uv run basedpyright libs/sdk

      - name: Fail if any lint step failed
        if: ${{ always() }}
        run: |
          results=(
            "${{ steps.ruff-format.outcome }}"
            "${{ steps.ruff-check.outcome }}"
            "${{ steps.pyright-api.outcome }}"
            "${{ steps.pyright-bot.outcome }}"
            "${{ steps.pyright-sdk.outcome }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "Lint failures detected."
              exit 1
            fi
          done
