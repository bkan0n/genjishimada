name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to test (defaults to triggering SHA)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-groups --all-packages

      - name: Run API tests
        run: uv run --project apps/api --group dev-api python scripts/run_api_tests.py --workers 2 --ignore=tests/integration/queue

  queue-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.13"
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Sync dependencies
        run: uv sync --locked --all-groups --all-packages

      - name: Check Docker availability
        run: docker info

      - name: Run complete backend queue acceptance
        run: just test-queue

      - name: Publish acceptance results and sanitized fault logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-acceptance
          path: artifacts/queue/
          if-no-files-found: error
